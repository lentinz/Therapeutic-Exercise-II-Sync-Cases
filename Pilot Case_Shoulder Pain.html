<head>

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF7; --paper-dim: #EEF2F3; --ink: #14213D; --ink-soft: #57657A;
    --teal: #1E7F97; --teal-dim: #E1EEF1; --ochre: #9C6B2E; --ochre-dim: #F3EADA;
    --forest: #27AE60; --forest-dim: #E1F7E9; --line: #DAE1E6; --line-strong: #AEB9C4;
    --yellow: #B79328; --yellow-dim: #FBF3DD; --red: #B0402E; --red-dim: #F7E6E1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 1.55; }
  h1, h2, h3, .serif { font-family: 'Source Serif 4', serif; }
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { border-right: 1px solid var(--line); padding: 28px 22px; background: var(--paper-dim); }
  .sidebar-title { font-size: 10.5px; letter-spacing: 0.02em; color: var(--teal); font-weight: 600; margin-bottom: 4px; }
  .sidebar-case { font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 600; margin-bottom: 28px; line-height: 1.3; }
  .stage-list { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  .stage-item { position: relative; padding: 9px 0 9px 18px; font-size: 13.5px; color: var(--ink-soft); }
  .stage-item::before { content: ''; position: absolute; left: -6px; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper-dim); border: 2px solid var(--line-strong); }
  .stage-item.active { color: var(--ink); font-weight: 600; }
  .stage-item.active::before { border-color: var(--teal); background: var(--teal); }
  .stage-item.done { color: var(--ink); }
  .stage-item.done::before { border-color: var(--forest); background: var(--forest); }
  .main { padding: 44px 56px; max-width: 800px; }
  .eyebrow { color: var(--teal); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  h1.stage-title { font-size: 27px; font-weight: 600; margin: 0 0 18px 0; }
  p.lede { color: var(--ink-soft); margin-bottom: 26px; max-width: 66ch; }
  .panel { border: 1px solid var(--line); background: #fff; padding: 22px 24px; margin-bottom: 18px; }
  .panel.dim { background: var(--paper-dim); }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); padding: 12px 14px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14.5px; color: var(--ink); resize: vertical; background: var(--paper); }
  input[type=number], input[type=text], select { border: 1px solid var(--line); padding: 8px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; background: var(--paper); color: var(--ink); }
  textarea:focus, button:focus-visible, .tile:focus-visible, input:focus { outline: 2px solid var(--teal); outline-offset: 2px; }
  .btn { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 11px 22px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; margin-top: 16px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.small { padding: 7px 14px; font-size: 13px; margin-top: 0; }
  .counter { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .counter strong { color: var(--teal); }
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border: 1px solid var(--line); background: var(--paper); padding: 13px 15px; text-align: left; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; font-size: 13.8px; color: var(--ink); }
  .tile:hover:not(:disabled) { border-color: var(--teal); }
  .tile.selected { border-color: var(--teal); background: var(--teal-dim); font-weight: 600; }
  .tile:disabled:not(.selected) { opacity: 0.4; cursor: not-allowed; }
  .category-label { font-size: 11px; color: var(--ink-soft); display: block; margin-bottom: 3px; }
  .finding { margin-top: 4px; padding: 14px 16px; border-left: 3px solid var(--line-strong); background: var(--paper-dim); font-size: 14px; }
  .finding-tag { font-weight: 600; font-size: 12px; display: block; margin-bottom: 4px; color: var(--teal); }
  .obj-category { margin-bottom: 34px; }
  .obj-category h3 { font-size: 16px; margin-bottom: 4px; }
  .obj-category .cat-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 12px; }
  table.rom-table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13.5px; }
  table.rom-table th, table.rom-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
  table.rom-table th { background: var(--paper-dim); font-weight: 600; }
  .imp-drag-list { list-style: none; padding: 0; margin: 0 0 18px 0; }
  .imp-drag-item { border: 1px solid var(--line); background: #fff; padding: 14px 16px; margin-bottom: 8px; cursor: grab; display: flex; align-items: center; gap: 12px; }
  .imp-drag-item.dragging { opacity: 0.4; }
  .imp-rank { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 20px; color: var(--teal); width: 24px; }
  .imp-name { font-weight: 600; font-size: 14.5px; }
  .imp-desc { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  .exercise-card { border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; }
  .exercise-card.selected { border-color: var(--teal); background: var(--teal-dim); }
  .exercise-card.disabled { cursor: default; opacity: 0.55; }
  .exercise-icon { flex-shrink: 0; width: 44px; height: 44px; }
  .exercise-name { font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
  .exercise-detail { font-size: 13.3px; color: var(--ink-soft); }
  .impairment-block { margin-bottom: 34px; }
  .impairment-block h3 { font-size: 16px; margin-bottom: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .priority-tag { font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .dosage-row { display: flex; gap: 14px; margin: 12px 0; flex-wrap: wrap; }
  .dosage-field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.8px; }
  .summary-row span:first-child { color: var(--ink-soft); }
  .feedback-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.8px; }
  .feedback-mark { flex-shrink: 0; font-weight: 700; }
  .feedback-mark.hit { color: var(--forest); }
  .feedback-mark.miss { color: var(--ochre); }
  .feedback-mark { flex-shrink: 0; font-weight: 700; }
  .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; }
  .hidden { display: none; }
  .tier-dot { display:inline-block; width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .tier-green { background: var(--forest); }
  .tier-yellow { background: var(--yellow); }
  .tier-red { background: var(--red); }
  .other-input { width: 100%; border: 1px dashed var(--line-strong); padding: 10px 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13.8px; background: var(--paper-dim); margin-top: 6px; box-sizing: border-box; }
  .slot-note { font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 12px 0; }
  .cert-field { margin-bottom: 20px; }
  .cert-field-label { font-weight: 600; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  #groupNameInputSummary { font-size: 15px; padding: 8px 10px; width: 320px; }
  .author-credit { position: fixed; bottom: 10px; right: 14px; font-size: 11px; color: var(--ink-soft); background: var(--paper); padding: 3px 8px; border: 1px solid var(--line); z-index: 20; }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    .sidebar, .btn, #printBar, .cert-field, .author-credit { display: none !important; }
    .app { display: block; }
    .main { padding: 10px; max-width: 100%; }
    .panel { break-inside: avoid; }
    .cert-header { break-inside: avoid; }
  }
  .cert-header {
    background: var(--ink);
    color: #fff;
    padding: 28px 32px;
    margin-bottom: 26px;
  }
  .cert-header .cert-eyebrow { color: #9FD3E0; font-weight: 600; font-size: 12px; letter-spacing: 0.04em; margin-bottom: 6px; }
  .cert-header h1 { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 600; margin: 0 0 14px 0; }
  .cert-header .cert-meta-row { display: flex; gap: 40px; flex-wrap: wrap; margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 14px; }
  .cert-header .cert-meta-item { }
  .cert-header .cert-meta-label { font-size: 11px; color: #B8C4D6; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .cert-header .cert-meta-value { font-size: 15px; font-weight: 600; }
  #certGroupNameLive { border-bottom: 1px dashed rgba(255,255,255,0.5); padding-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-title">DPHT 7250: THERAPEUTIC EXERCISE II</div>
    <div class="sidebar-case">Case 1<br>Right Shoulder Pain</div>
    <ul class="stage-list" id="stageList"></ul>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="author-credit">Case author: Zachary Lentini, PT, DPT</div>
<script>
const STAGES = ["Welcome & Objectives","Case Intro","Subjective: Reflect","Subjective: Interview","Objective: Reflect","Objective: Examine","Impairment Priority","Treatment: Exercise & Dosage","Case Summary"];
let current = 0;
let maxVisited = 0;

const state = {
  groupName: "",
  subjOpen: "", subjPicked: [],
  objOpen: "",
  screeningPicked: [], differentialPicked: [], impairmentSearchPicked: [],
  impairmentOrder: [], topPriorities: [],
  exerciseSlots: {},   // { impId: [ {type:'menu', idx} | {type:'other', text} ] }
  otherShown: {},       // { impId: true } — write-in input row is open but not yet committed to a slot
  dosage: {},           // { impId_slotIdx: {sets,reps,loadtype,loadval,rationale} }
  otherInterventions: ""
};

const TIER_DOT = { green: '<span class="tier-dot tier-green"></span>', yellow: '<span class="tier-dot tier-yellow"></span>', red: '<span class="tier-dot tier-red"></span>' };
const TIER_LABEL = { green: 'Green — strong choice', yellow: 'Yellow — acceptable choice', red: 'Red — not advised' };

const SUBJ_QUESTIONS = [
  { id:'s1', cat:'Onset', q:'How did the pain begin?', a:'Gradual onset over 4 months, no single traumatic event. Started after increasing tennis play from once to three times weekly.', tier:'green' },
  { id:'s2', cat:'Pain behavior', q:'Any night pain or trouble sleeping on that side?', a:'Wakes 2–3 times per night when rolling onto the right shoulder. Cannot sleep on that side at all currently.', tier:'green' },
  { id:'s3', cat:'Aggravating factors', q:'What activities make it worse?', a:'Overhead serving motion in tennis, reaching into a high cabinet, and putting on a jacket.', tier:'green' },
  { id:'s4', cat:'Red flags', q:'Any unexplained weight loss, fever, or night sweats?', a:'None reported. No constitutional symptoms.', tier:'green' },
  { id:'s5', cat:'Prior treatment', q:'Has anything been tried so far?', a:'Over-the-counter NSAIDs with mild, temporary relief. No formal PT or injections yet.', tier:'green' },
  { id:'s6', cat:'Function', q:'What activities matter most to get back to?', a:'Wants to return to competitive tennis and is frustrated by not being able to serve without pain.', tier:'yellow' },
  { id:'s7', cat:'History', q:'Any prior shoulder injuries?', a:'None on the right. Reports a minor left shoulder strain 6 years ago that resolved without treatment.', tier:'yellow' },
  { id:'s8', cat:'Occupation', q:'What does a typical work day involve?', a:'Desk-based project manager, occasional overhead reaching for storage but not repetitive or loaded.', tier:'red' }
];
const SUBJ_LIMIT = 5;

const SCREENING = [
  { id:'sc1', name:'Cervical spine active screen', desc:'AROM and overpressure, cervical clearing', result:'Full, pain-free cervical AROM in all planes. No reproduction of shoulder symptoms.', tier:'green' },
  { id:'sc2', name:'Systemic / red flag screen', desc:'Vitals, constitutional symptoms check', result:'No fever, no unexplained weight loss, no night sweats. Vitals within normal limits.', tier:'green' },
  { id:'sc3', name:'Apley scratch test', desc:'Combined-motion gross shoulder mobility screen, bilateral', result:'Mild restriction reaching up the back on the right compared to the left. Reaching overhead behind the head is roughly symmetrical.', tier:'yellow' },
  { id:'sc4', name:'Functional squat observation', desc:'General lower-quarter movement screen, unrelated body region', result:'Full squat depth with no compensations noted — unremarkable, and not clinically relevant to this presentation.', tier:'red' }
];
const SCREEN_LIMIT = 2;

const DIFFERENTIAL = [
  { id:'d1', name:"Neer's impingement test", desc:'Passive forward flexion with scapular stabilization', result:'Positive — reproduces the familiar lateral shoulder pain.', tier:'green' },
  { id:'d2', name:'Hawkins-Kennedy test', desc:'Passive internal rotation at 90° flexion', result:'Positive — reproduces the lateral shoulder pain.', tier:'green' },
  { id:'d3', name:'Empty can test', desc:'Isometric resistance in scapular plane, thumb down', result:'Pain and mild weakness on the right compared to the left.', tier:'yellow' },
  { id:'d4', name:'Drop arm test', desc:'Screens for full-thickness rotator cuff tear', result:'Negative — the arm is lowered with control.', tier:'red' }
];
const DIFF_LIMIT = 2;

const IMPSEARCH = [
  { id:'is2', name:'Resisted strength testing by plane', desc:'Isometric resistance testing, scapular plane and rotations', revealsImpairment:'i1', result:'Reduced force production on resisted abduction and external rotation on the right compared to the left, limited in part by pain.', tier:'green' },
  { id:'is1', name:'AROM / PROM measurement (table)', desc:'Flexion, abduction, internal and external rotation, both sides', revealsImpairment:'i2', isTable:true, tier:'green' },
  { id:'is3', name:'Scapular dyskinesis observation', desc:'Observe scapular motion during active arm elevation', revealsImpairment:'i3', result:'Early scapular elevation and mild winging noted during active elevation past 90°, more pronounced on the right.', tier:'green' },
  { id:'is4', name:'Cross-body adduction / posterior shoulder mobility', desc:'Passive cross-body adduction, bilateral comparison', revealsImpairment:'i4', result:'Cross-body adduction measured approximately 20° less on the right than the left.', tier:'yellow' },
  { id:'is5', name:'Thoracic spine mobility screen', desc:'Active thoracic extension and rotation', revealsImpairment:'i5', result:'Reduced active thoracic extension noted, with a tendency to substitute lumbar extension.', tier:'yellow' },
  { id:'is6', name:'Functional task observation', desc:'Observe reaching, dressing-type movement patterns', revealsImpairment:'i6', result:'Guarding and hesitancy observed when reaching overhead; patient reports avoiding the motion whenever possible.', tier:'red' }
];
const IMPSEARCH_LIMIT = 3;

const ROM_DATA = [
  { plane:'Flexion', aromR:'165°', aromL:'180°', promR:'175°', promL:'180°' },
  { plane:'Abduction', aromR:'150° (painful arc 70-120°)', aromL:'180°', promR:'165°', promL:'180°' },
  { plane:'Internal rotation', aromR:'45°', aromL:'60°', promR:'50°', promL:'62°' },
  { plane:'External rotation', aromR:'75°', aromL:'85°', promR:'80°', promL:'85°' }
];

const IMPAIRMENTS = {
  i1: { name:'Reduced force production — resisted abduction / external rotation', desc:'Right-sided weakness relative to the left on manual muscle testing.' },
  i2: { name:'Internal rotation ROM asymmetry', desc:'Measured IR deficit compared to the uninvolved side; cause not yet determined.' },
  i3: { name:'Altered scapular motion during elevation', desc:'Early elevation and mild winging observed past 90° of arm elevation.' },
  i4: { name:'Reduced cross-body adduction ROM', desc:'Approximately 20° less than the uninvolved side; contributing structure not yet determined.' },
  i5: { name:'Reduced thoracic extension mobility', desc:'Limited active thoracic extension with lumbar substitution.' },
  i6: { name:'Movement avoidance / guarding with overhead tasks', desc:'Observed hesitancy and self-reported avoidance of overhead reaching.' }
};

// Exercise menu per impairment: 4 options each, tiered. Impairments i1-i3 (case-central) skew green;
// i4-i6 (real but lower priority this visit) skew yellow/red as a natural consequence of over-prioritizing them.
const EXERCISES = {
  i1: [
    { name:'Sidelying external rotation with light dumbbell', desc:'Isometric/isotonic resistance exercise performed sidelying, targeting posterior cuff musculature with light dumbbell load.', reveal:'Low load and controlled tempo directly support the rotator cuff force couple — a solid fit for this finding.', tier:'green' },
    { name:'Prone horizontal abduction ("T" raises)', desc:'Prone exercise targeting posterior cuff and scapular retractor musculature.', reveal:'Targets the right muscle groups with an appropriate loading strategy.', tier:'green' },
    { name:'Scaption with external rotation ("full can")', desc:'Loaded exercise performed in the scapular plane of elevation with external rotation.', reveal:'Reasonable cuff-loading exercise, but performed in a slightly higher-irritability position than the "T" raise or sidelying ER variants.', tier:'yellow' },
    { name:'Heavy overhead barbell press', desc:'Heavy overhead pressing pattern loading the shoulder complex.', reveal:'Loads the cuff and deltoid, but far too aggressive for a still-irritable subacromial presentation.', tier:'red' }
  ],
  i2: [
    { name:'Sleeper stretch', desc:'Sidelying passive internal rotation stretch.', reveal:'Directly and specifically targets the measured IR deficit.', tier:'green' },
    { name:'Cross-body horizontal adduction stretch', desc:'Cross-body adduction stretch targeting posterior shoulder tissue.', reveal:'Directly targets posterior shoulder restriction contributing to the IR deficit.', tier:'green' },
    { name:'Posterior shoulder self-mobilization against wall', desc:'Sustained low-load stretch performed independently against a wall.', reveal:'A reasonable option, but less targeted to this specific deficit than the sleeper or cross-body stretch.', tier:'yellow' },
    { name:'Partner-assisted forced overpressure stretch', desc:'Partner-assisted stretch applying manual overpressure at end range.', reveal:'Risks excessive force on a restriction whose cause hasn\u2019t actually been determined yet — not appropriate this early.', tier:'red' }
  ],
  i3: [
    { name:'Scapular wall slides', desc:'Wall-supported exercise reinforcing scapular upward rotation and posterior tilt during arm elevation.', reveal:'Reinforces the exact motion pattern that was found to be altered.', tier:'green' },
    { name:'Lower trapezius "Y" raises', desc:'Prone or standing exercise targeting the lower trapezius in a "Y" position.', reveal:'Targets a commonly underactive scapular stabilizer relevant to this finding.', tier:'green' },
    { name:'Serratus anterior wall push-up plus', desc:'Closed-chain exercise emphasizing scapular protraction and serratus anterior activation.', reveal:'Good target muscle, but a more advanced progression than this patient likely needs as a starting point.', tier:'yellow' },
    { name:'Heavy barbell shrugs', desc:'Loaded shrug exercise emphasizing upper trapezius activation.', reveal:'Reinforces upper trap dominance — works against what this finding is calling for.', tier:'red' }
  ],
  i4: [
    { name:'Side-lying stretch with towel roll', desc:'Sidelying stretch performed with a towel roll for support.', reveal:'A gentle, well-tolerated option appropriate for a still-irritable shoulder.', tier:'green' },
    { name:'Sleeper stretch', desc:'Sidelying passive internal rotation stretch.', reveal:'Same tissue target as the IR asymmetry exercise — a workable but somewhat redundant use of this treatment slot.', tier:'yellow' },
    { name:'Cross-body stretch with scapular stabilization', desc:'Cross-body adduction stretch performed with manual scapular stabilization.', reveal:'Reasonable, but adds a layer of complexity not clearly needed for this finding yet.', tier:'yellow' },
    { name:'Manual end-range joint mobilization without further assessment', desc:'Clinician-applied manual mobilization technique at end range.', reveal:'Jumps to a specific manual technique before the actual restricting structure has been identified — premature here.', tier:'red' }
  ],
  i5: [
    { name:'Seated thoracic extension with towel', desc:'Seated thoracic extension exercise performed using a rolled towel.', reveal:'Low-equipment, gentle home option well suited as a starting point.', tier:'green' },
    { name:'Thoracic extension over foam roller', desc:'Supine thoracic extension performed over a foam roller.', reveal:'Effective, but more setup than needed as a starting point.', tier:'yellow' },
    { name:'Quadruped thoracic rotation', desc:'Quadruped rotational mobility exercise targeting the thoracic spine.', reveal:'Reasonable, but a secondary priority relative to a straightforward extension exercise here.', tier:'yellow' },
    { name:'High-velocity thoracic spine manipulation', desc:'High-velocity, low-amplitude manual thrust technique to the thoracic spine.', reveal:'Outside the scope of what this finding calls for at this stage.', tier:'red' }
  ],
  i6: [
    { name:'Activity pacing and load management education', desc:'Patient education focused on activity pacing and graded load management.', reveal:'Directly addresses avoidance behavior without adding physical load.', tier:'green' },
    { name:'Graded return-to-activity program', desc:'Structured, progressive return-to-activity program.', reveal:"Appropriate longer-term, but a bigger commitment than a single session's priority should carry.", tier:'yellow' },
    { name:'Progressive resistance circuit, uninvolved-side-led', desc:'General progressive resistance circuit led by the uninvolved side.', reveal:'A reasonable but fairly indirect way to address this specific impairment.', tier:'yellow' },
    { name:'Immediate full return to competitive tennis without graded progression', desc:'Immediate return to full competitive tennis participation.', reveal:'Skips the graded exposure this impairment is actually calling for.', tier:'red' }
  ]
};

const IDEAL_TOP_IMPAIRMENTS = ['i1','i3','i2'];

// Shuffle tiered lists once per page load so tier (green/yellow/red) can never be inferred
// from display position. Mutates the arrays in place — safe because everything downstream
// (tier lookups, dosage keys, exercise slot indices) reads from these same array objects.
function shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
shuffleInPlace(SUBJ_QUESTIONS);
shuffleInPlace(SCREENING);
shuffleInPlace(DIFFERENTIAL);
shuffleInPlace(IMPSEARCH);
Object.keys(EXERCISES).forEach(k => shuffleInPlace(EXERCISES[k]));


function revealedImpairmentIds() {
  return state.impairmentSearchPicked.map(id => IMPSEARCH.find(x => x.id === id).revealsImpairment);
}

function renderSidebar() {
  document.getElementById('stageList').innerHTML = STAGES.map((s,i) => {
    let cls = i === current ? 'active' : (i <= maxVisited ? 'done' : '');
    const clickable = i <= maxVisited && i !== current;
    return `<li class="stage-item ${cls}" ${clickable ? `style="cursor:pointer;" onclick="goTo(${i})"` : ''}>${s}</li>`;
  }).join('');
}

function goTo(stage) { current = stage; if (stage > maxVisited) maxVisited = stage; render(); window.scrollTo(0,0); }

function render() {
  renderSidebar();
  let html = RENDERERS[current]();
  if (current > 0) {
    html = `<button class="btn secondary small" style="margin-bottom:20px;" onclick="goTo(${current-1})">&larr; Back</button>` + html;
  }
  document.getElementById('main').innerHTML = html;
  if (current === 6) initDragList();
  if (current === 0) checkWelcomeReady();
  if (current === 2) checkMinWords('subjOpenInput','subjContinueBtn',10);
  if (current === 5) checkMinWords('objOpenInput','objContinueBtn',10);
}

function wordCount(text) {
  const t = (text || '').trim();
  return t.length === 0 ? 0 : t.split(/\s+/).length;
}
function checkMinWords(textareaId, btnId, min) {
  const ta = document.getElementById(textareaId);
  const btn = document.getElementById(btnId);
  if (!ta || !btn) return;
  btn.disabled = wordCount(ta.value) < min;
}
function checkWelcomeReady() {
  const nameEl = document.getElementById('groupNameInput');
  const ackEl = document.getElementById('ackCheckbox');
  const btn = document.getElementById('welcomeContinueBtn');
  if (!nameEl || !ackEl || !btn) return;
  btn.disabled = !(nameEl.value.trim().length > 0 && ackEl.checked);
}

const RENDERERS = [renderWelcome, renderIntro, renderSubjOpen, renderSubjInterview, renderObjOpen, renderObjExamine, renderImpairments, renderTreatment, renderSummary];

const ACTIVITY_OBJECTIVES = [
  'Prioritize subjective and objective examination items under a limited-selection constraint that mirrors real clinical time pressure.',
  'Differentiate higher-yield clinical findings from lower-yield or misleading ones based on the case presentation.',
  'Rank impairments according to their clinical relevance to the case.',
  'Prescribe exercise-based interventions, including exercise selection and dosage, that address a prioritized impairment.',
  'Justify clinical decisions using sound reasoning rather than guesswork, such as citing specific subjective or objective findings.',

function toggleScreening(id) { toggleInArr(state.screeningPicked, id, SCREEN_LIMIT); render(); }
function toggleDifferential(id) { toggleInArr(state.differentialPicked, id, DIFF_LIMIT); render(); }
function toggleImpSearch(id) { toggleInArr(state.impairmentSearchPicked, id, IMPSEARCH_LIMIT); render(); }
function toggleInArr(arr, id, limit) {
  const i = arr.indexOf(id);
  if (i >= 0) arr.splice(i,1);
  else if (arr.length < limit) arr.push(id);
}

function renderImpairments() {
  const revealed = revealedImpairmentIds();
  if (state.impairmentOrder.length === 0) state.impairmentOrder = [...revealed];
  else state.impairmentOrder = state.impairmentOrder.filter(id => revealed.includes(id)).concat(revealed.filter(id => !state.impairmentOrder.includes(id)));
  const maxRank = Math.min(3, revealed.length);
  return `
    <div class="eyebrow">IMPAIRMENT PRIORITY</div>
    <h1 class="stage-title">Rank the Impairments You Found</h1>
    <p class="lede">Only impairments you revealed during the objective exam appear here. Drag to reorder — the top ${maxRank} will carry forward to treatment.</p>
    <ul class="imp-drag-list" id="impDragList">
      ${state.impairmentOrder.map((id, idx) => {
        const imp = IMPAIRMENTS[id];
        return `<li class="imp-drag-item" draggable="true" data-id="${id}">
          <span class="imp-rank">${idx < maxRank ? idx+1 : '—'}</span>
          <div><div class="imp-name">${imp.name}</div><div class="imp-desc">${imp.desc}</div></div>
        </li>`;
      }).join('')}
    </ul>
    <button class="btn" ${revealed.length === 0 ? 'disabled' : ''} onclick="confirmPriorities()">Continue to Treatment Selection</button>
  `;
}

function initDragList() {
  const list = document.getElementById('impDragList');
  if (!list) return;
  let dragEl = null;
  list.querySelectorAll('.imp-drag-item').forEach(item => {
    item.addEventListener('dragstart', () => { dragEl = item; item.classList.add('dragging'); });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); syncOrderFromDom(); render(); });
  });
  list.addEventListener('dragover', (e) => {
    e.preventDefault();
    const after = [...list.querySelectorAll('.imp-drag-item:not(.dragging)')].find(el => e.clientY <= el.getBoundingClientRect().top + el.getBoundingClientRect().height/2);
    if (!dragEl) return;
    if (after) list.insertBefore(dragEl, after); else list.appendChild(dragEl);
  });
}
function syncOrderFromDom() {
  const list = document.getElementById('impDragList');
  if (!list) return;
  state.impairmentOrder = [...list.querySelectorAll('.imp-drag-item')].map(el => el.dataset.id);
}
function confirmPriorities() {
  const maxRank = Math.min(3, state.impairmentOrder.length);
  state.topPriorities = state.impairmentOrder.slice(0, maxRank);
  goTo(7);
}

function slotsNeeded(rank) { return rank === 1 ? 2 : (rank === 2 ? 1 : 0); }

function renderTreatment() {
  const priorities = state.topPriorities || [];
  return `
    <div class="eyebrow">TREATMENT — EXERCISE & DOSAGE</div>
    <h1 class="stage-title">Select Exercises and Prescribe Dosage</h1>
    <p class="lede">Priority #1 needs 2 exercises, priority #2 needs 1, priority #3 is not addressed this session. For each slot, pick a listed option or write in your own.</p>
    ${priorities.map((impId, rankIdx) => {
      const rank = rankIdx + 1;
      const imp = IMPAIRMENTS[impId];
      const need = slotsNeeded(rank);
      if (need === 0) {
        return `<div class="impairment-block"><h3>Priority #3 — ${imp.name}</h3><div class="priority-tag">Not addressed this session.</div></div>`;
      }
      const options = EXERCISES[impId];
      const slots = state.exerciseSlots[impId] || [];
      const menuChosenIdxs = slots.filter(s => s.type === 'menu').map(s => s.idx);
      const committedOther = slots.find(s => s.type === 'other');
      const showInputRow = state.otherShown[impId] || !!committedOther;
      return `
        <div class="impairment-block">
          <h3>Priority #${rank} — ${imp.name}</h3>
          <div class="priority-tag">Select ${need} exercise${need>1?'s':''} total — from the list, written in, or a mix (${slots.length} / ${need} filled)</div>
          ${options.map((ex, idx) => `
            <div class="exercise-card ${menuChosenIdxs.includes(idx) ? 'selected' : ''}" onclick="toggleMenuExercise('${impId}', ${idx}, ${need})">
              <div><div class="exercise-name">${ex.name}</div><div class="exercise-detail">${ex.desc}</div></div>
            </div>
          `).join('')}
          <div class="slot-note">Don't see a fit? Write in your own exercise for one slot:</div>
          ${showInputRow ? `
            <div style="display:flex; gap:8px; align-items:center;">
              <input class="other-input" style="flex:1;" value="${committedOther ? committedOther.text : ''}" placeholder="Describe your exercise...">
              <button class="btn small" onclick="commitOtherExercise('${impId}', this.previousElementSibling.value, ${need})">${committedOther ? 'Update' : 'Set'}</button>
              ${committedOther ? `<button class="btn small secondary" onclick="removeOtherExercise('${impId}')">Remove</button>` : `<button class="btn small secondary" onclick="cancelOtherExercise('${impId}')">Cancel</button>`}
            </div>
            ${!committedOther ? `<div class="slot-note">Not counted as a slot until you click Set.</div>` : ''}
          ` : `<button class="btn small secondary" ${slots.length >= need ? 'disabled' : ''} onclick="addOtherExercise('${impId}')">+ Write in an exercise</button>`}
        </div>
      `;
    }).join('')}
    <div class="panel dim">
      <label style="font-weight:600; display:block; margin-bottom:10px;">Other interventions (manual therapy, modalities, etc.) — optional</label>
      <textarea id="otherIntInput" placeholder="Note anything else you'd include this session...">${state.otherInterventions}</textarea>
    </div>
    ${renderDosageBlocks(priorities)}
    <button class="btn" id="completeCaseBtn" ${!allSlotsFilledAndDosed(priorities) ? 'disabled' : ''} onclick="completeTreatment()">Complete Case</button>
  `;
}

function toggleMenuExercise(impId, idx, need) {
  const slots = state.exerciseSlots[impId] || [];
  const existingIdx = slots.findIndex(s => s.type === 'menu' && s.idx === idx);
  if (existingIdx >= 0) { slots.splice(existingIdx, 1); }
  else if (slots.length < need) { slots.push({ type:'menu', idx }); }
  state.exerciseSlots[impId] = slots;
  render();
}
function addOtherExercise(impId) {
  state.otherShown[impId] = true;
  render();
}
function cancelOtherExercise(impId) {
  state.otherShown[impId] = false;
  render();
}
function commitOtherExercise(impId, text, need) {
  const trimmed = (text || '').trim();
  if (!trimmed) return;
  const slots = state.exerciseSlots[impId] || [];
  const existing = slots.find(s => s.type === 'other');
  if (existing) {
    existing.text = trimmed;
  } else if (slots.length < need) {
    slots.push({ type:'other', text: trimmed });
  } else {
    return; // no room — shouldn't normally happen since the button is only shown when a slot is open
  }
  state.exerciseSlots[impId] = slots;
  state.otherShown[impId] = true;
  render();
}
function removeOtherExercise(impId) {
  state.exerciseSlots[impId] = (state.exerciseSlots[impId] || []).filter(s => s.type !== 'other');
  state.otherShown[impId] = false;
  render();
}

function slotLabel(impId, slot) {
  if (slot.type === 'menu') return EXERCISES[impId][slot.idx].name;
  return slot.text || '(write-in exercise — not yet named)';
}

function renderDosageBlocks(priorities) {
  const filled = priorities.filter(id => (state.exerciseSlots[id]||[]).length > 0);
  if (filled.length === 0) return '';
  return `
    <div class="eyebrow" style="margin-top:8px;">DOSAGE & RATIONALE</div>
    ${filled.map(impId => (state.exerciseSlots[impId]||[]).map((slot, slotIdx) => {
      const key = impId + '_' + slotIdx;
      const d = state.dosage[key] || {};
      return `
        <div class="panel">
          <div style="font-weight:600; margin-bottom:2px;">${slotLabel(impId, slot)}</div>
          <div style="color:var(--ink-soft); font-size:13px; margin-bottom:12px;">Addressing: ${IMPAIRMENTS[impId].name}</div>
          <div class="dosage-row">
            <div class="dosage-field"><label>Sets</label><input type="number" id="sets_${key}" min="1" value="${d.sets||''}" style="width:70px;" oninput="saveDosageField('${key}','sets',this.value)"></div>
            <div class="dosage-field"><label>Reps</label><input type="number" id="reps_${key}" min="1" value="${d.reps||''}" style="width:70px;" oninput="saveDosageField('${key}','reps',this.value)"></div>
            <div class="dosage-field"><label>Load type</label>
              <select id="loadtype_${key}" onchange="saveDosageField('${key}','loadtype',this.value)">
                <option ${d.loadtype==='Absolute'?'selected':''}>Absolute</option>
                <option ${d.loadtype==='%1RM'?'selected':''}>%1RM</option>
                <option ${d.loadtype==='RIR'?'selected':''}>RIR</option>
                <option ${d.loadtype==='RPE'?'selected':''}>RPE</option>
              </select>
            </div>
            <div class="dosage-field"><label>Load value</label><input type="text" id="loadval_${key}" placeholder="e.g. 3 lb or RPE 6" value="${d.loadval||''}" style="width:120px;" oninput="saveDosageField('${key}','loadval',this.value)"></div>
          </div>
          <textarea id="rationale_${key}" placeholder="Why this exercise, at this dosage, for this patient right now?" oninput="saveDosageField('${key}','rationale',this.value)">${d.rationale||''}</textarea>
        </div>
      `;
    }).join('')).join('')}
  `;
}
function saveDosageField(key, field, value) {
  if (!state.dosage[key]) state.dosage[key] = {};
  state.dosage[key][field] = value;
  updateCompleteBtn();
}
function updateCompleteBtn() {
  const btn = document.getElementById('completeCaseBtn');
  if (!btn) return;
  btn.disabled = !allSlotsFilledAndDosed(state.topPriorities || []);
}

function allSlotsFilledAndDosed(priorities) {
  for (const impId of priorities) {
    const rank = priorities.indexOf(impId) + 1;
    const need = slotsNeeded(rank);
    const slots = state.exerciseSlots[impId] || [];
    if (slots.length !== need) return false;
    for (let i = 0; i < slots.length; i++) {
      const key = impId + '_' + i;
      const d = state.dosage[key];
      if (!d || !d.sets || !d.reps || !d.loadval || !d.rationale) return false;
    }
  }
  return true;
}

function completeTreatment() {
  const el = document.getElementById('otherIntInput');
  if (el) state.otherInterventions = el.value;
  goTo(8);
}

}

      ${priorities.map((id, i) => `<div class="summary-row"><span>Priority #${i+1}</span><span>${IMPAIRMENTS[id].name} ${idealMatch[i] ? '(matches expert ranking)' : ''}</span></div>`).join('') || '<div class="summary-row"><span>No impairments prioritized</span><span>—</span></div>'}

        </div>`;
      }).join('')).join('') || '<div>No exercises selected.</div>'}
      ${state.otherInterventions ? `<div style="margin-top:10px;"><strong>Other interventions:</strong> ${state.otherInterventions}</div>` : ''}
    </div>
    <p class="lede">This section is not scored against a tier system — it's the main focus of our large-group debrief.</p>

    <div id="printBar">
      <button class="btn" onclick="window.print()">Download / Print Certificate</button>
      <button class="btn secondary" onclick="location.reload()">Restart Case</button>
    </div>
  `;
}

function saveAndGo(inputId, key, nextStage) { state[key] = document.getElementById(inputId).value; goTo(nextStage); }

render();
</script>
</body>
</html>
